name: Daily Trend Report

on:
  # 定时触发：每天 PST 7:00 (UTC 15:00)
  schedule:
    - cron: '0 15 * * *'

  # 手动触发
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Always work on the real main branch (never a detached commit), with
          # full history so the push step can reconcile safely if main moved.
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run trend monitor
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python main.py

      - name: Commit and push reports and daily data
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Re-attach main explicitly: a scheduled run can leave the checkout in
          # a detached HEAD, and a commit made there would never reach main.
          git checkout -B main
          git add docs/*.html
          # Stage daily JSON history (new + modified + pruned files) and the
          # markdown analysis. This must NOT be silenced: a `|| true` here hid
          # months of missing data history (data/ was gitignored).
          git add -A -- data/daily analysis/daily data/validation
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: Update daily report, indie analysis and daily data [skip ci]"
          # Explicit refspec (never an implicit branch guess) + one safe
          # reconciliation attempt if main advanced while we were running.
          # No force push, ever: if rebasing is not safe we fail loudly instead
          # of overwriting newer commits.
          for attempt in 1 2; do
            if git push origin HEAD:main; then
              echo "Pushed the report commit to main (attempt ${attempt})"
              exit 0
            fi
            echo "Push rejected - reconciling with origin/main (attempt ${attempt})"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Could not reconcile with origin/main safely - manual attention required."
              exit 1
            fi
          done
          echo "::error::Failed to push the report commit to main after retrying."
          exit 1

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: trend-report
          path: report.md
          retention-days: 7
